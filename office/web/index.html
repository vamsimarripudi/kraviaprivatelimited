<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#0b1724" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
<title>KRAVIA Office</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><div class="mark">K</div><div><strong>KRAVIA</strong><span>Office</span></div></div>
    <div class="entity"><i></i><div><b>KRAVIA PRIVATE LIMITED</b><small>Company operating system</small></div></div>
    <nav id="nav"></nav>
    <div class="railFoot"><button id="sessionBtn" class="ghost full">Session & access</button><div id="apiState" class="health">Checking API…</div></div>
  </aside>
  <main class="stage">
    <header class="topbar"><div><p id="crumb">KRAVIA PRIVATE LIMITED</p><h1 id="title">Command Center</h1></div><div class="actions"><button id="refresh" class="ghost">Refresh</button><button id="commandBtn" class="searchBtn">Search / command <kbd>⌘K</kbd></button><button id="createBtn" class="primary">+ Create</button></div></header>
    <section id="content" class="content"></section>
  </main>
</div>
<div id="modalWrap" class="overlay" hidden><section class="modal"><header><div><p id="modalKicker">KRAVIA Office</p><h2 id="modalTitle">Action</h2></div><button id="modalClose" class="icon">×</button></header><div id="modalBody" class="modalBody"></div></section></div>
<div id="drawerWrap" class="overlay drawerWrap" hidden><aside class="drawer"><header><div><p id="drawerKicker">Record</p><h2 id="drawerTitle">Details</h2></div><button id="drawerClose" class="icon">×</button></header><div id="drawerBody" class="drawerBody"></div></aside></div>
<div id="toast" class="toastStack"></div>
<script src="app.js"></script>
</body>
</html>
