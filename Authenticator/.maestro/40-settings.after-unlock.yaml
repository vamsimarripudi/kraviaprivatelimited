appId: com.kraviaprivatelimited.authenticator
name: KRAVIA Settings security state after OS unlock
---
- assertVisible: "Authenticator"
- tapOn: "Settings"
- assertVisible: "Settings"
- assertVisible: "Biometric Lock"
- assertVisible: "Lock on Background"
- assertVisible: "Clipboard Export"
- assertVisible: "Activation help"
- assertVisible: "Privacy & Security"
- assertVisible: "About Authenticator"
- assertVisible: "App Version"
- tapOn: "Authenticator"
