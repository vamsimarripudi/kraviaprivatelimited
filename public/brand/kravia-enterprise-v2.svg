<?xml version="1.0" encoding="utf-8"?>
<svg id="kravia-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="100%" height="100%">
                <defs>
                    <filter id="crisp-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.15"/>
                    </filter>
                </defs>

                <style>
                    /* 
                     * "CORE EXPANSION" MOTION GRAPHICS
                     * Fluid, centralized blooming animation for a high-tech data feel.
                     * Featuring Multi-Color Activation transitioning to Solid Navy.
                     */
                    
                    :root {
                        --core-ease: cubic-bezier(0.85, 0, 0.15, 1);
                        --brand-navy: #051940;
                        
                        /* Activation Colors */
                        --c-core: #0ea5e9;    /* Bright Sky Blue */
                        --c-pillar: #3b82f6;  /* Deep Royal Blue */
                        --c-top: #8b5cf6;     /* Vibrant Violet */
                        --c-bottom: #f43f5e;  /* energetic Rose/Coral */
                    }

                    .k-part { 
                        opacity: 0; 
                    }
                    
                    /* The central spark */
                    .k-core {
                        animation: pulse-core 4s infinite var(--core-ease);
                        transform-origin: 100px 115px;
                    }
                    
                    /* The left structural pillar */
                    .k-pillar {
                        animation: slide-pillar 4s infinite var(--core-ease);
                        transform-origin: 100px 115px;
                    }
                    
                    /* The expanding arms */
                    .k-top {
                        animation: slide-top 4s infinite var(--core-ease);
                        transform-origin: 100px 115px;
                    }
                    
                    .k-bottom {
                        animation: slide-bottom 4s infinite var(--core-ease);
                        transform-origin: 100px 115px;
                    }

                    /* 4-SECOND TIMELINE KEYFRAMES WITH COLOR SHIFTING */
                    @keyframes pulse-core {
                        0%, 5% { opacity: 0; transform: scale(0) rotate(-90deg); fill: var(--c-core); }
                        15%, 85% { opacity: 1; transform: scale(1) rotate(0); fill: var(--brand-navy); }
                        95%, 100% { opacity: 0; transform: scale(0) rotate(90deg); fill: var(--c-core); }
                    }

                    @keyframes slide-pillar {
                        0%, 15% { opacity: 0; transform: translateX(60px) scaleY(0.2); fill: var(--c-pillar); }
                        25%, 85% { opacity: 1; transform: translateX(0) scaleY(1); fill: var(--brand-navy); }
                        95%, 100% { opacity: 0; transform: translateX(60px) scaleY(0.2); fill: var(--c-pillar); }
                    }

                    @keyframes slide-top {
                        0%, 18% { opacity: 0; transform: translate(-30px, 40px) scale(0.5); fill: var(--c-top); }
                        28%, 85% { opacity: 1; transform: translate(0, 0) scale(1); fill: var(--brand-navy); }
                        95%, 100% { opacity: 0; transform: translate(-30px, 40px) scale(0.5); fill: var(--c-top); }
                    }

                    @keyframes slide-bottom {
                        0%, 20% { opacity: 0; transform: translate(-30px, -40px) scale(0.5); fill: var(--c-bottom); }
                        30%, 85% { opacity: 1; transform: translate(0, 0) scale(1); fill: var(--brand-navy); }
                        95%, 100% { opacity: 0; transform: translate(-30px, -40px) scale(0.5); fill: var(--c-bottom); }
                    }
                </style>

                <!-- Centering the 180x210 artwork inside the 260x260 viewBox -->
                <g filter="url(#crisp-shadow)" transform="translate(0, 15)">
                    <!-- 1. The Core (Inner Triangle) -->
                    <polygon points="90,95 110,115 90,135" class="k-part k-core"/>
                    
                    <!-- 2. Left Pillar (Now full height to match arms) -->
                    <rect x="40" y="10" width="40" height="210" class="k-part k-pillar"/>
                    
                    <!-- 3. Top Diagonal Arm -->
                    <polygon points="120,70 180,10 220,10 120,110" class="k-part k-top"/>
                    
                    <!-- 4. Bottom Diagonal Arm -->
                    <polygon points="120,160 220,220 180,220 120,120" class="k-part k-bottom"/>
                </g>
            </svg>