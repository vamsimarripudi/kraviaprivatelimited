name: kravia-office

# Initial EC2 migration: ALB terminates TLS; allow EC2 port 8000 only from ALB SG.
services:
  clamav:
    image: clamav/clamav:1.5.4-debian
    restart: unless-stopped
    networks: [internal]
    volumes:
      - clamav-signatures:/var/lib/clamav
    mem_reservation: 1g
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-2
        awslogs-group: /kravia/prod/ec2
        awslogs-stream: clamav
        awslogs-create-group: "false"

  api:
    build:
      context: ../../../Backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: /etc/kravia/api.env
        format: raw
    ports:
      - "8000:8000"
    depends_on:
      clamav:
        condition: service_healthy
    volumes:
      - /var/lib/kravia/private-vault:/app/runtime/private-vault
    networks: [internal]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-2
        awslogs-group: /kravia/prod/ec2
        awslogs-stream: api
        awslogs-create-group: "false"

  worker:
    build:
      context: ../../../Backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: /etc/kravia/worker.env
        format: raw
    depends_on:
      clamav:
        condition: service_healthy
    volumes:
      - /var/lib/kravia/private-vault:/app/runtime/private-vault
    networks: [internal]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-2
        awslogs-group: /kravia/prod/ec2
        awslogs-stream: worker
        awslogs-create-group: "false"

volumes:
  clamav-signatures:

networks:
  internal:
    driver: bridge
