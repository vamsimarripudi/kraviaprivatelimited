name: Search discovery audit
on:
  push:
    branches: [feat/search-ai-discovery-20261104]
    paths: [.github/workflows/search-discovery-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: Frontend
      - name: Read repository guidance and public metadata sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for f in ['AGENTS.md','Frontend/AGENTS.md','Frontend/next.config.ts','Frontend/proxy.ts','Frontend/app/page.tsx','Frontend/app/support/page.tsx','Frontend/app/company/leadership/page.tsx','Frontend/app/robots.ts','Frontend/app/manifest.ts']:
              p=Path(f)
              if p.exists(): print('\n--- SOURCE '+f+' ---\n'+p.read_text())
          print('\n--- EXISTING AI DISCOVERY FILES ---')
          for root in ['Frontend/app','Frontend/public']:
              for p in Path(root).rglob('*'):
                  if 'llms' in str(p).lower() and p.is_file(): print(str(p)+'\n'+p.read_text()[:12000])
          print('\n--- PRODUCT ROUTE METADATA ---')
          for p in Path('Frontend/app/products').rglob('page.tsx'):
              s=p.read_text(); print(str(p)+'\n'+s[:3500])
          print('\n--- PUBLIC CONTENT TYPE / PUBLIC PRODUCTS ---')
          s=Path('Frontend/lib/corporate-content.ts').read_text()
          i=s.find('export const publicProducts'); print(s[max(0,i-2500):i+15000])
          s=Path('Frontend/lib/legal/published-policy-pack.ts').read_text()
          i=s.find('export function staticLegalRedirect'); print(s[i:i+1500])
          docs=Path('Frontend/node_modules/next/dist/docs')
          for term in ['generate-metadata','robots','sitemap','route-handlers','json-ld']:
              matches=list(docs.rglob('*'+term+'*')) if docs.exists() else []
              for p in matches[:1]:
                  if p.is_file(): print('\n--- INSTALLED NEXT DOC '+str(p)+' ---\n'+p.read_text()[:10000])
          PY
      - name: Read public production HTTP metadata without credentials
        run: |
          node --input-type=module <<'JS'
          for (const origin of ['https://kraviaprivatelimited.com','https://www.kraviaprivatelimited.com']) {
            for (const path of ['/', '/contact', '/robots.txt', '/sitemap.xml']) {
              try {
                const response=await fetch(origin+path,{signal:AbortSignal.timeout(20000)});
                const body=await response.text();
                const metadata=path.endsWith('.txt')||path.endsWith('.xml')?body.slice(0,14000):[...body.matchAll(/<(?:title|meta|link)\b[^>]*>(?:[^<]*<\/title>)?|<script\b[^>]*type="application\/ld\+json"[^>]*>[\s\S]*?<\/script>/g)].map(m=>m[0]).join('\n');
                console.log(JSON.stringify({requested:origin+path,status:response.status,finalUrl:response.url,robots:response.headers.get('x-robots-tag'),metadata}));
              } catch(error) { console.log(JSON.stringify({requested:origin+path,error:String(error)})); }
            }
          }
          JS
