name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: Frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('Frontend/package-lock.json') }}
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      APP_ENV: development
      AUTH_MODE: bootstrap
      FINANCE_EXECUTION_MODE: sandbox
      DATABASE_URL: sqlite:///./kravia-office-ci.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Backend/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q backend
      - name: Verify Office OpenAPI contract
        run: python scripts/export_openapi.py --check
      - run: alembic upgrade head
      - run: python -m pytest backend/tests -q
      - run: python scripts/quality_gate.py

  database-structure:
    name: Database structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify versioned database project
        shell: bash
        run: |
          test -f Database/supabase/config.toml
          test -d Database/supabase/migrations
          test -n "$(find Database/supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"

  repository-structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify application boundaries
        shell: bash
        run: |
          test -d Frontend
          test -d Backend
          test -d Database
          test ! -d app
          test ! -d components
          test ! -d lib
          test ! -d office
          test ! -d supabase
