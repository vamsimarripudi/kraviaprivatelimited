name: Quality gates
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/secret-scan.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  office-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: office
    env:
      APP_ENV: development
      AUTH_MODE: bootstrap
      FINANCE_EXECUTION_MODE: sandbox
      DATABASE_URL: sqlite:///${{ runner.temp }}/kravia-office-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: office/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend
      - run: alembic upgrade head
      - run: python -m pytest backend/tests -q
      - run: python scripts/quality_gate.py
