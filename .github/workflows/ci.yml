name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main && git config --global advice.detachedHead false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: Frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('Frontend/package-lock.json') }}
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      APP_ENV: development
      AUTH_MODE: bootstrap
      FINANCE_EXECUTION_MODE: sandbox
      DATABASE_URL: sqlite:///./kravia-office-ci.db
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main && git config --global advice.detachedHead false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Backend/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q backend
      - name: Verify Office OpenAPI contract
        run: python scripts/export_openapi.py --check
      - run: alembic upgrade head
      - run: python -m pytest backend/tests -q
      - run: python scripts/quality_gate.py
      - name: Build Railway container
        run: docker build --file Dockerfile.api --tag kravia-office-api:ci .
      - name: Verify packaged PostgreSQL driver
        run: >-
          docker run --rm --entrypoint python kravia-office-api:ci -c
          "import psycopg; from backend.database import normalize_database_url; assert normalize_database_url('postgresql://user:pass@localhost/db') == 'postgresql+psycopg://user:pass@localhost/db'"
      - name: Smoke test packaged liveness endpoint
        shell: bash
        run: |
          cid=$(docker run -d -p 18000:8000 \
            -e APP_ENV=development \
            -e AUTH_MODE=bootstrap \
            -e FINANCE_EXECUTION_MODE=sandbox \
            -e DATABASE_URL=sqlite:////tmp/kravia-office-ci.db \
            kravia-office-api:ci)
          cleanup() {
            docker logs "$cid" || true
            docker rm -f "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Container liveness check failed" >&2
          exit 1
      - name: Build background worker container
        run: docker build --file Dockerfile.worker --tag kravia-office-worker:ci .
      - name: Smoke test background worker one-shot
        shell: bash
        run: |
          output=$(docker run --rm \
            --entrypoint python \
            -e APP_ENV=development \
            -e DATABASE_URL=sqlite:////tmp/kravia-office-worker-ci.db \
            kravia-office-worker:ci \
            -m backend.worker --once --batch-size 25)
          echo "$output"
          echo "$output" | grep '"status": "COMPLETED"'

  database-structure:
    name: Database structure
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main && git config --global advice.detachedHead false
      - uses: actions/checkout@v7
      - name: Verify versioned database project
        shell: bash
        run: |
          test -f Database/supabase/config.toml
          test -d Database/supabase/migrations
          test -n "$(find Database/supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"

  repository-structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main && git config --global advice.detachedHead false
      - uses: actions/checkout@v7
      - name: Verify application boundaries
        shell: bash
        run: |
          test -d Frontend
          test -d Backend
          test -d Database
          test ! -d app
          test ! -d components
          test ! -d lib
          test ! -d office
          test ! -d supabase

  deploy-railway-api:
    name: Railway API deploy
    needs: [frontend, backend, database-structure, repository-structure]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RAILWAY_PROJECT_ID: 8746e560-db2a-4834-80c5-54db0e6e013e
      RAILWAY_ENVIRONMENT_ID: 1f9e03bc-97d8-4ed8-8d31-58cda4bfffd1
      RAILWAY_SERVICE_ID: 76254870-0c4c-469f-9bd4-ddc20574526f
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect backend or deploy-workflow changes
        id: changes
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$before" "${{ github.sha }}" -- Backend/ .github/workflows/ci.yml; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy current main to existing Railway API service
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN is not configured; Railway API deployment was not started."
            exit 0
          fi
          npx -y @railway/cli@5.57.9 up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --message "GitHub Actions ${GITHUB_SHA}"
      - name: No backend deployment required
        if: steps.changes.outputs.deploy != 'true'
        run: echo "No Backend/ or Railway deploy-workflow changes in this main push."

