name: KRAVIA AWS EC2 manual deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: kravia-aws-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws-production
    steps:
      - name: Assume a scoped AWS role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ vars.KRAVIA_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: KraviaEC2Deploy
      - name: Deploy immutable commit through SSM Run Command
        shell: bash
        env:
          TARGET_INSTANCE: ${{ vars.KRAVIA_AWS_EC2_INSTANCE_ID }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TARGET_INSTANCE" =~ ^i-[0-9a-f]{8,17}$ ]]
          COMMAND_ID="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$TARGET_INSTANCE" \
            --parameters "commands=[\"/opt/kravia/deploy.sh $RELEASE_SHA\"]" \
            --comment "KRAVIA reviewed release $RELEASE_SHA" \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE"
          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$TARGET_INSTANCE" \
            --query Status --output text)"
          test "$STATUS" = Success
          echo "SSM deployment completed for $RELEASE_SHA"
