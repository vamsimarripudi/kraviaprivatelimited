name: KRAVIA Office invitation policy PostgreSQL integration

on:
  pull_request:
    paths:
      - "Database/supabase/migrations/202611120002_office_invitation_catalog_alignment.sql"
      - "Database/supabase/tests/office-invitation-catalog-smoke.sql"
      - ".github/workflows/office-invitation-policy-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: Office invitation catalog on ephemeral PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: kravia_invite_policy_ci
          POSTGRES_PASSWORD: ci-invitation-policy-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kravia_invite_policy_ci"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify migration against historical invitation constraints
        shell: bash
        run: |
          set -euo pipefail
          pg() {
            docker run --rm --network host \
              --volume "$PWD:/repo:ro" --workdir /repo \
              --env PGPASSWORD=ci-invitation-policy-only postgres:17 \
              psql --host 127.0.0.1 --username postgres \
                --dbname kravia_invite_policy_ci --set ON_ERROR_STOP=1 "$@"
          }
          output="$(pg --tuples-only --no-align --file Database/supabase/tests/office-invitation-catalog-smoke.sql)"
          echo "$output"
          test "$(printf '%s\n' "$output" | tail -n 1)" = "INVITATION_CATALOG_ALIGNMENT_PASS"
