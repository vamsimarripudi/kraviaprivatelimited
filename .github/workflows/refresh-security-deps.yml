name: Refresh security dependencies
on:
  push:
    paths:
      - .github/workflows/refresh-security-deps.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Upgrade patched Next.js toolchain
        run: npm install --save-exact next@16.3.5 eslint-config-next@16.3.5
      - name: Apply compatible transitive security fixes
        run: npm audit fix
      - name: Enforce high/critical vulnerability gate
        run: npm audit --audit-level=high
      - name: Validate application after dependency refresh
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "fix: update vulnerable frontend dependencies"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
