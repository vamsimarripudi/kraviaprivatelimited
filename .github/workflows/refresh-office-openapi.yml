name: Refresh Office OpenAPI
on:
  push:
    paths:
      - .github/workflows/refresh-office-openapi.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: office/backend/requirements.txt
      - name: Install Office dependencies
        run: python -m pip install -r backend/requirements.txt
        working-directory: office
      - name: Generate canonical Office OpenAPI
        run: python scripts/export_openapi.py
        working-directory: office
        env:
          APP_ENV: development
          AUTH_MODE: bootstrap
          FINANCE_EXECUTION_MODE: sandbox
          DATABASE_URL: sqlite:///./kravia-office-openapi.db
      - name: Verify generated contract contains new controls
        run: |
          grep -q '"/api/v1/accounting/period-locks"' spec/api/openapi.json
          grep -q '"/api/v1/integrations/google-drive/evidence-readiness"' spec/api/openapi.json
        working-directory: office
      - name: Commit generated contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add office/spec/api/openapi.json
          if git diff --cached --quiet; then
            echo "OpenAPI contract already current"
          else
            git commit -m "docs(office): refresh OpenAPI contract"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
