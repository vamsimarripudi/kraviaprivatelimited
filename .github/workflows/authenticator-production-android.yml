name: KRAVIA Authenticator production Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kravia-authenticator-production-android
  cancel-in-progress: false

jobs:
  production-android:
    name: Production-signed Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Authenticator
    env:
      KRAVIA_AUTH_ANDROID_KEYSTORE_B64: ${{ secrets.KRAVIA_AUTH_ANDROID_KEYSTORE_B64 }}
      KRAVIA_AUTH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KRAVIA_AUTH_ANDROID_KEYSTORE_PASSWORD }}
      KRAVIA_AUTH_ANDROID_KEY_ALIAS: ${{ secrets.KRAVIA_AUTH_ANDROID_KEY_ALIAS }}
      KRAVIA_AUTH_ANDROID_KEY_PASSWORD: ${{ secrets.KRAVIA_AUTH_ANDROID_KEY_PASSWORD }}
      KRAVIA_AUTH_ANDROID_CERT_SHA256: ${{ secrets.KRAVIA_AUTH_ANDROID_CERT_SHA256 }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Authenticator/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Require KRAVIA production signing identity
        shell: bash
        run: |
          set -euo pipefail
          for name in             KRAVIA_AUTH_ANDROID_KEYSTORE_B64             KRAVIA_AUTH_ANDROID_KEYSTORE_PASSWORD             KRAVIA_AUTH_ANDROID_KEY_ALIAS             KRAVIA_AUTH_ANDROID_KEY_PASSWORD             KRAVIA_AUTH_ANDROID_CERT_SHA256
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Verify Expo dependency compatibility
        run: npx expo install --check

      - name: Dependency audit
        run: npm audit --package-lock-only --audit-level=high

      - name: TypeScript and security tests
        run: |
          npm run typecheck
          npm test

      - name: Generate deterministic KRAVIA assets
        run: npm run prepare:assets

      - name: Materialize KRAVIA Android keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/kravia-authenticator-production.jks"
          printf '%s' "$KRAVIA_AUTH_ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "KRAVIA_AUTH_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Verify configured signing alias exists
        shell: bash
        run: |
          set -euo pipefail
          keytool -list             -keystore "$KRAVIA_AUTH_ANDROID_KEYSTORE_PATH"             -storepass "$KRAVIA_AUTH_ANDROID_KEYSTORE_PASSWORD"             -alias "$KRAVIA_AUTH_ANDROID_KEY_ALIAS" >/dev/null

      - name: Generate Android native project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Apply KRAVIA production signing
        run: node scripts/configure-android-release-signing.mjs

      - name: Build production APK and AAB
        working-directory: Authenticator/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify production APK signer and expected certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"

          apksigner="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -1)"
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "::error::Android apksigner was not found"
            exit 1
          fi

          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/kravia-authenticator-signer.txt"

          if grep -qi "Android Debug" "$RUNNER_TEMP/kravia-authenticator-signer.txt"; then
            echo "::error::Production APK is signed with Android Debug"
            exit 1
          fi

          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/kravia-authenticator-signer.txt" | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          expected="$(printf '%s' "$KRAVIA_AUTH_ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Production APK signer fingerprint does not match KRAVIA_AUTH_ANDROID_CERT_SHA256"
            exit 1
          fi

      - name: Verify production AAB signature
        shell: bash
        run: |
          set -euo pipefail
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$aab"
          jarsigner -verify -strict "$aab"

      - name: Verify final offline Android manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find android/app/build/intermediates -path '*release*' -path '*merged_manifests*' -name AndroidManifest.xml -print -quit)"
          if [ -z "$manifest" ] || [ ! -f "$manifest" ]; then
            echo "::error::Merged release AndroidManifest.xml was not found"
            exit 1
          fi
          grep -q 'android.permission.CAMERA' "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::Production KRAVIA Authenticator must not request Android INTERNET permission"
            exit 1
          fi
          if grep -q 'android.permission.RECORD_AUDIO' "$manifest"; then
            echo "::error::Production KRAVIA Authenticator must not request RECORD_AUDIO permission"
            exit 1
          fi

      - name: Stage production artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          cp android/app/build/outputs/apk/release/app-release.apk "kravia-authenticator-v${version}-production.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "kravia-authenticator-v${version}-production.aab"
          sha256sum             "kravia-authenticator-v${version}-production.apk"             "kravia-authenticator-v${version}-production.aab"             | tee "kravia-authenticator-v${version}-production.sha256"

      - name: Upload controlled production handoff
        uses: actions/upload-artifact@v4
        with:
          name: kravia-authenticator-production-android
          path: |
            Authenticator/kravia-authenticator-v*-production.apk
            Authenticator/kravia-authenticator-v*-production.aab
            Authenticator/kravia-authenticator-v*-production.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove materialized signing key
        if: always()
        shell: bash
        run: rm -f "${KRAVIA_AUTH_ANDROID_KEYSTORE_PATH:-}"
