name: KRAVIA Authenticator production Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kravia-authenticator-production-android
  cancel-in-progress: false

jobs:
  production-android:
    name: Production Android AAB and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Authenticator
    env:
      KRAVIA_ANDROID_KEYSTORE_B64: ${{ secrets.KRAVIA_ANDROID_KEYSTORE_B64 }}
      KRAVIA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KRAVIA_ANDROID_KEYSTORE_PASSWORD }}
      KRAVIA_ANDROID_KEY_ALIAS: ${{ secrets.KRAVIA_ANDROID_KEY_ALIAS }}
      KRAVIA_ANDROID_KEY_PASSWORD: ${{ secrets.KRAVIA_ANDROID_KEY_PASSWORD }}
      EXPO_PUBLIC_OFFICE_API_ORIGIN: ${{ secrets.KRAVIA_AUTHENTICATOR_API_ORIGIN }}
      EXPECTED_SIGNING_SHA256: "1008958AD5191C64DAA3D403C56B687B674C26913ACB8D86E2EF2971E8647B75"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Authenticator/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate protected signing inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in             KRAVIA_ANDROID_KEYSTORE_B64             KRAVIA_ANDROID_KEYSTORE_PASSWORD             KRAVIA_ANDROID_KEY_ALIAS             KRAVIA_ANDROID_KEY_PASSWORD             EXPO_PUBLIC_OFFICE_API_ORIGIN
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required protected secret $name is not configured."
              exit 1
            fi
          done
          if [ "$KRAVIA_ANDROID_KEY_ALIAS" != "kravia-authenticator-production" ]; then
            echo "::error::Production key alias does not match the KRAVIA-controlled signing identity."
            exit 1
          fi
          case "$EXPO_PUBLIC_OFFICE_API_ORIGIN" in
            https://*) ;;
            *) echo "::error::KRAVIA_AUTHENTICATOR_API_ORIGIN must be an HTTPS origin."; exit 1 ;;
          esac
          if [ "$EXPO_PUBLIC_OFFICE_API_ORIGIN" != "https://kravia-office-api-production.up.railway.app" ]; then
            echo "::error::KRAVIA_AUTHENTICATOR_API_ORIGIN must use the managed production Office API origin."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Verify Expo SDK dependency compatibility
        run: npx expo install --check

      - name: Verify application quality before signing
        run: |
          npm run prepare:assets
          npm run typecheck
          npm test

      - name: Materialize protected production keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/kravia-authenticator-production.jks"
          printf '%s' "$KRAVIA_ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "KRAVIA_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

          actual="$(
            keytool -list -v               -keystore "$keystore"               -storepass "$KRAVIA_ANDROID_KEYSTORE_PASSWORD"               -alias "$KRAVIA_ANDROID_KEY_ALIAS"             | sed -n 's/^[[:space:]]*SHA256: //p'             | head -n 1             | tr -d ':[:space:]'
          )"
          if [ "$actual" != "$EXPECTED_SIGNING_SHA256" ]; then
            echo "::error::Production keystore certificate fingerprint mismatch."
            exit 1
          fi
          echo "KRAVIA production keystore fingerprint verified."

      - name: Generate Android native project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Bind release build to protected KRAVIA signer
        run: node scripts/configure-production-android-signing.mjs

      - name: Build production AAB and APK
        working-directory: Authenticator/android
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Verify production APK, manifest, API origin and signatures
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find android/app/build/intermediates -path '*release*' -path '*merged_manifests*' -name AndroidManifest.xml -print -quit)"
          test -n "$manifest"
          test -f "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest"
          if grep -q 'android.permission.CAMERA' "$manifest"; then
            echo "::error::Production Authenticator must not request camera permission."
            exit 1
          fi
          if grep -q 'android.permission.RECORD_AUDIO' "$manifest"; then
            echo "::error::Production KRAVIA Authenticator must not request audio recording."
            exit 1
          fi

          apk="android/app/build/outputs/apk/release/app-release.apk"
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          apk_badging="$("$build_tools/aapt" dump badging "$apk")"
          apk_package="$(printf '%s\n' "$apk_badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          apk_version_code="$(printf '%s\n' "$apk_badging" | sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          apk_version_name="$(printf '%s\n' "$apk_badging" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          if [ "$apk_package" != "com.kraviaprivatelimited.authenticator" ]; then
            echo "::error::Production APK package identifier does not match KRAVIA Authenticator."
            exit 1
          fi
          if [ "$apk_version_code" != "1" ] || [ "$apk_version_name" != "1.0.0" ]; then
            echo "::error::Production APK version must be 1.0.0 (versionCode 1)."
            exit 1
          fi

          bundle_entry="$(unzip -Z1 "$apk" | grep -E '(^|/)index\.android\.bundle$' | head -n 1 || true)"
          if [ -z "$bundle_entry" ]; then
            echo "::error::Production APK does not contain the Authenticator Android JavaScript bundle."
            exit 1
          fi
          if ! unzip -p "$apk" "$bundle_entry" | grep -aFq "$EXPO_PUBLIC_OFFICE_API_ORIGIN"; then
            echo "::error::Production APK bundle does not contain the configured Office API origin."
            exit 1
          fi
          if unzip -p "$apk" "$bundle_entry" | grep -aEq 'https?://(localhost|127\.0\.0\.1|10\.0\.2\.2)([:/]|$)'; then
            echo "::error::Production Authenticator bundle contains a development API origin."
            exit 1
          fi

          "$build_tools/apksigner" verify --verbose --print-certs "$apk"             | tee kravia-authenticator-production-apk.signature.txt

          mapfile -t apk_fingerprints < <(
            grep -E 'certificate SHA-256 digest:' kravia-authenticator-production-apk.signature.txt \
              | sed -E 's/^.*certificate SHA-256 digest:[[:space:]]*//' \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d ':[:space:]' \
              | sort -u
          )
          if [ "${#apk_fingerprints[@]}" -eq 0 ]; then
            echo "::error::Unable to extract APK signing certificate SHA-256."
            exit 1
          fi
          if [ "${#apk_fingerprints[@]}" -ne 1 ]; then
            echo "::error::Production APK must expose exactly one signer certificate."
            exit 1
          fi
          apk_fp="${apk_fingerprints[0]}"
          if [ "$apk_fp" != "$EXPECTED_SIGNING_SHA256" ]; then
            echo "::error::APK signer does not match the KRAVIA production certificate."
            exit 1
          fi

          jarsigner -verify -strict "$aab" > kravia-authenticator-production-aab.signature.txt
          keytool -printcert -jarfile "$aab" > kravia-authenticator-production-aab.certificate.txt
          aab_fp="$(
            sed -n 's/^[[:space:]]*SHA256: //p' kravia-authenticator-production-aab.certificate.txt             | head -n 1             | tr -d ':[:space:]'
          )"
          if [ -z "$aab_fp" ]; then
            echo "::error::Unable to extract AAB signing certificate SHA-256."
            exit 1
          fi
          if [ "$aab_fp" != "$EXPECTED_SIGNING_SHA256" ]; then
            echo "::error::AAB signer does not match the KRAVIA production certificate."
            exit 1
          fi

      - name: Record production build evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk             production-artifacts/KRAVIA-Authenticator-Production-v1.0.0.apk
          cp android/app/build/outputs/bundle/release/app-release.aab             production-artifacts/KRAVIA-Authenticator-Production-v1.0.0.aab
          cp kravia-authenticator-production-apk.signature.txt production-artifacts/
          cp kravia-authenticator-production-aab.signature.txt production-artifacts/
          cp kravia-authenticator-production-aab.certificate.txt production-artifacts/

          (
            cd production-artifacts
            sha256sum               KRAVIA-Authenticator-Production-v1.0.0.apk               KRAVIA-Authenticator-Production-v1.0.0.aab               > SHA256SUMS.txt
          )

          {
            echo "KRAVIA Authenticator production Android build"
            echo "commit=$GITHUB_SHA"
            echo "package=com.kraviaprivatelimited.authenticator"
            echo "app_version=1.0.0"
            echo "version_code=1"
            echo "signing_alias=kravia-authenticator-production"
            echo "signing_sha256=$EXPECTED_SIGNING_SHA256"
            echo "distribution=Google Play / managed private distribution pending provider-side upload"
          } > production-artifacts/BUILD-EVIDENCE.txt

      - name: Remove production keystore
        if: always()
        shell: bash
        run: |
          if [ -n "${KRAVIA_ANDROID_KEYSTORE_PATH:-}" ]; then
            rm -f "$KRAVIA_ANDROID_KEYSTORE_PATH"
          fi

      - name: Upload production Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kravia-authenticator-production-android
          path: Authenticator/production-artifacts/
          if-no-files-found: error
          retention-days: 7
