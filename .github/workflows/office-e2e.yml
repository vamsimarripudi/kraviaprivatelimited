name: KRAVIA Office browser E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Frontend/app/office/office-design-system.css"
      - "Frontend/app/office/office-surface-integrity.css"
      - "Frontend/app/office/office-mobile-contrast.css"
      - "Frontend/components/office-presence-control*"
      - "Frontend/components/office-recruitment-workspace*"
      - "Frontend/components/office-work-hub*"
      - "Frontend/components/office-master-data*"
      - "Frontend/components/office-manual-hub*"
      - "Frontend/components/office-workspace-shell.tsx"
      - "Frontend/components/internal-workspace-screen.tsx"
      - "Frontend/lib/office/manual*"
      - "Frontend/app/api/office-manual/**"
      - "Frontend/app/office/quick-start/**"
      - "Frontend/app/office/layout.tsx"
      - "Frontend/app/finance/layout.tsx"
      - "Frontend/components/office-appearance-root.tsx"
      - "Frontend/components/office-workspace-processing*"
      - "Frontend/components/workforce-administration-panel*"
      - "Testing/playwright/**"
      - ".github/workflows/office-e2e.yml"
  push:
    branches: [main]
    paths:
      - "Testing/playwright/**"
      - "Frontend/app/office/office-surface-integrity.css"
      - "Frontend/app/office/office-mobile-contrast.css"
      - "Frontend/components/office-presence-control*"
      - "Frontend/components/office-recruitment-workspace*"
      - "Frontend/components/office-work-hub*"
      - "Frontend/components/office-master-data*"
      - "Frontend/components/office-manual-hub*"
      - "Frontend/components/office-workspace-shell.tsx"
      - "Frontend/components/internal-workspace-screen.tsx"
      - "Frontend/lib/office/manual*"
      - "Frontend/app/api/office-manual/**"
      - "Frontend/app/office/quick-start/**"
      - "Frontend/next.config.ts"
      - "Frontend/tests/office-auth-cache-policy.test.ts"
      - ".github/workflows/office-e2e.yml"

permissions:
  contents: read

concurrency:
  group: kravia-office-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Office browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install canonical Frontend dependencies
        working-directory: Frontend
        run: npm ci --no-fund --no-audit

      - name: Install pinned Playwright test harness
        working-directory: Testing/playwright
        run: npm install --no-fund --no-audit

      - name: Install Chromium and WebKit runtimes
        working-directory: Testing/playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Run desktop + mobile Chromium Office auth E2E
        working-directory: Testing/playwright
        env:
          CI: "1"
        run: npm run test:ci

      - name: Run iPhone WebKit Office layout and contrast checks
        working-directory: Testing/playwright
        env:
          CI: "1"
        run: npx playwright test tests/office-surface-integrity.spec.mjs tests/office-theme.spec.mjs tests/office-manual.spec.mjs --project=mobile-webkit

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kravia-office-playwright-failure-evidence
          path: |
            Testing/playwright/test-results
            Testing/playwright/playwright-report
          if-no-files-found: ignore
          retention-days: 5
