name: KRAVIA temporary Expo lock regeneration

on:
  push:
    branches: [fix/office-qr-recovery-progress-20261112]
    paths:
      - ".github/workflows/kravia-expo-lock-refresh.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/office-qr-recovery-progress-20261112
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve exact Expo SDK dependencies into npm lockfile
        working-directory: Authenticator
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify the generated graph can be installed
        working-directory: Authenticator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit ONLY regenerated npm lockfile
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -- Authenticator/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already satisfies package.json"
          else
            git commit -m "chore(authenticator): regenerate SDK 57 compatible npm lockfile"
            git push origin HEAD:refs/heads/fix/office-qr-recovery-progress-20261112
          fi
