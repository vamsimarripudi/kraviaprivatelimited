name: Refresh Zod for social release

on:
  push:
    branches: [feat/corporate-social-links-20261104]
    paths: [.github/workflows/refresh-zod-social-release.yml]

permissions:
  contents: read

jobs:
  patch-zod:
    if: github.repository == 'vamsimarripudi/kraviaprivatelimited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Resolve only the audited Zod patch
        working-directory: Frontend
        run: |
          node -e 'const p=require("./package.json"); if(p.dependencies.zod !== "4.3.6") throw new Error("Unexpected Zod version; review before changing it")'
          npm view zod@4.6.7 version dist.integrity
          npm install --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund zod@4.6.7
          node -e 'const p=require("./package.json"), l=require("./package-lock.json"); if(p.dependencies.zod !== "4.6.7" || l.packages["node_modules/zod"].version !== "4.6.7") throw new Error("Zod lock mismatch")'
      - name: Commit only the dependency manifest and lockfile
        run: |
          git diff --stat
          git diff --exit-code -- . ':!Frontend/package.json' ':!Frontend/package-lock.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Frontend/package.json Frontend/package-lock.json
          git commit -m 'fix: patch Zod security advisory before social release'
          git push origin HEAD:refs/heads/feat/corporate-social-links-20261104
