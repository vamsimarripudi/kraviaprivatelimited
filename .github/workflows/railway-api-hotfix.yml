name: Railway API hotfix deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/railway-api-hotfix.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy current main to Railway API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_PROJECT_ID: 8746e560-db2a-4834-80c5-54db0e6e013e
      RAILWAY_ENVIRONMENT_ID: 1f9e03bc-97d8-4ed8-8d31-58cda4bfffd1
      RAILWAY_SERVICE_ID: 76254870-0c4c-469f-9bd4-ddc20574526f
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API_URL: https://kravia-office-api-production.up.railway.app
    steps:
      - uses: actions/checkout@v7
      - name: Require Railway token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAILWAY_TOKEN" || { echo "::error::RAILWAY_TOKEN is missing"; exit 1; }
      - name: Deploy API from repository source
        shell: bash
        run: |
          set -euo pipefail
          npx -y @railway/cli@5.57.9 up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --message "Founder bootstrap hotfix ${GITHUB_SHA}"
      - name: Verify live API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$API_URL/health/live" >/tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          curl --fail --silent --show-error "$API_URL/api/v1/auth/bootstrap-status" | tee /tmp/bootstrap.json
          # Founder bootstrap deliberately closes after the first successful
          # registration. Validate the endpoint contract without reopening or
          # requiring that one-time registration state in production.
          python - <<'PY'
          import json

          with open("/tmp/bootstrap.json", encoding="utf-8") as status_file:
              status = json.load(status_file)

          assert isinstance(status.get("registration_open"), bool)
          assert status.get("role") == "FOUNDER"
          assert status.get("role_locked") is True
          assert status.get("public_registration_closes_after_success") is True
          PY
      - name: Verify device approval review route
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/device-review.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"action_token":"synthetic-token-value-which-is-long-enough-123456"}' \
            "$API_URL/api/v1/auth/device-approvals/11111111-1111-4111-8111-111111111111/review")"
          test "$status" = "404"
          grep -q 'Device approval request was not found' /tmp/device-review.json
