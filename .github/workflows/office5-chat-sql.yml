name: Office 5.0 isolated chat SQL rehearsal

on:
  pull_request:
    paths:
      - "Database/supabase/migrations/202611140007_office_chat_private_messages.sql"
      - "Database/supabase/migrations/202611140008_office_chat_private_groups.sql"
      - "Database/supabase/migrations/202611140011_office_chat_threads_and_search.sql"
      - "Database/supabase/migrations/202611140012_office_chat_department_channels.sql"
      - "Database/supabase/migrations/202611140015_office_chat_unread_snapshot.sql"
      - "Database/supabase/migrations/202611140016_office_chat_pinned_messages.sql"
      - "Database/supabase/migrations/202611140017_office_chat_reactions.sql"
      - "Database/supabase/migrations/202611140018_office_chat_scope_triggers.sql"
      - "Database/supabase/migrations/202611140019_office_chat_user_preferences.sql"
      - "Database/supabase/migrations/202611140020_office_chat_private_realtime.sql"
      - "Database/supabase/migrations/202611140021_office_chat_private_typing.sql"
      - "Database/supabase/tests/office5_chat_security.sql"
      - "Database/supabase/tests/office5_chat_extended_security.sql"
      - "Database/supabase/tests/office5_chat_department_security.sql"
      - "Database/supabase/tests/office5_chat_unread_security.sql"
      - "Database/supabase/tests/office5_chat_pins_security.sql"
      - "Database/supabase/tests/office5_chat_reactions_security.sql"
      - "Database/supabase/tests/office5_chat_scope_triggers_security.sql"
      - "Database/supabase/tests/office5_chat_preferences_security.sql"
      - "Database/supabase/tests/office5_chat_realtime_security.sql"
      - "Database/supabase/tests/office5_chat_typing_security.sql"
      - ".github/workflows/office5-chat-sql.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-postgres:
    name: Private chat authorization / isolated Postgres 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-isolated-office-only
          POSTGRES_DB: kravia_office_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kravia_office_chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - name: Validate private data, membership, idempotency and group authority
        shell: bash
        run: |
          set -euo pipefail
          pg() {
            docker run --rm --network host --volume "$PWD:/repo:ro" --workdir /repo \
              --env PGPASSWORD=ci-isolated-office-only postgres:17 \
              psql --host 127.0.0.1 --username postgres --dbname kravia_office_chat_test \
              --set ON_ERROR_STOP=1 "$@"
          }
          pg --command "create role anon nologin; create role authenticated nologin; create role service_role nologin; create extension if not exists pgcrypto; create table public.office_identity_users(user_id uuid primary key, status text not null); create table public.office_job_assignments(user_id uuid primary key, department_code text, status text);"
          pg --file Database/supabase/migrations/202611140007_office_chat_private_messages.sql
          pg --file Database/supabase/migrations/202611140008_office_chat_private_groups.sql
          pg --file Database/supabase/migrations/202611140011_office_chat_threads_and_search.sql
          pg --file Database/supabase/migrations/202611140012_office_chat_department_channels.sql
          pg --file Database/supabase/migrations/202611140015_office_chat_unread_snapshot.sql
          pg --file Database/supabase/migrations/202611140016_office_chat_pinned_messages.sql
          pg --file Database/supabase/migrations/202611140017_office_chat_reactions.sql
          pg --file Database/supabase/migrations/202611140018_office_chat_scope_triggers.sql
          pg --file Database/supabase/migrations/202611140019_office_chat_user_preferences.sql
          # The private attachment source is not loaded in this isolated chat
          # fixture; its independently scanned storage table is mocked only
          # for trigger installation, never granted to browser SQL roles.
          pg --command "create table public.office_chat_attachment_objects(id uuid primary key,conversation_id uuid not null references public.office_chat_conversations(id),status text,message_id uuid);"
          pg --file Database/supabase/migrations/202611140020_office_chat_private_realtime.sql
          pg --file Database/supabase/migrations/202611140021_office_chat_private_typing.sql
          pg --file Database/supabase/tests/office5_chat_security.sql
          pg --file Database/supabase/tests/office5_chat_extended_security.sql
          pg --file Database/supabase/tests/office5_chat_department_security.sql
          pg --file Database/supabase/tests/office5_chat_unread_security.sql
          pg --file Database/supabase/tests/office5_chat_pins_security.sql
          pg --file Database/supabase/tests/office5_chat_reactions_security.sql
          pg --file Database/supabase/tests/office5_chat_scope_triggers_security.sql
          pg --file Database/supabase/tests/office5_chat_preferences_security.sql
          pg --file Database/supabase/tests/office5_chat_realtime_security.sql
          pg --file Database/supabase/tests/office5_chat_typing_security.sql
          counts="$(pg --tuples-only --no-align --command "select (select count(*) from public.office_chat_conversations),(select count(*) from public.office_chat_messages)")"
          test "$counts" = "0|0"
