name: Verify released search discovery
on:
  push:
    branches: [feat/search-ai-discovery-20261104]
    paths: [.github/workflows/verify-search-release.yml]
permissions:
  contents: read
jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dc521a38f02d1f7bed4840e14479626e904ba7c4
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Read public response diagnostics without credentials
        run: |
          node --input-type=module <<'JS'
          for (const path of ['/', '/contact', '/contact?seo-verification=dc521a3', '/company/faq', '/support', '/llms.txt']) {
            const response = await fetch('https://www.kraviaprivatelimited.com'+path, { signal: AbortSignal.timeout(25000) });
            const body = await response.text();
            const metadata = [...body.matchAll(/<(?:title|meta|link)\b[^>]*>(?:[^<]*<\/title>)?/g)].map(m=>m[0]).join('\n');
            const heading = body.match(/<h1\b[^>]*>[\s\S]*?<\/h1>/)?.[0];
            const headers = Object.fromEntries(['content-type','cache-control','age','x-vercel-cache','x-vercel-id','x-matched-path','location'].map(key=>[key,response.headers.get(key)]));
            console.log(JSON.stringify({path,status:response.status,finalUrl:response.url,headers,heading,metadata:metadata||body.slice(0,1200)}));
          }
          JS
      - name: Verify the real public production responses
        working-directory: Frontend
        run: node scripts/search-smoke.mjs
        env:
          SEARCH_SMOKE_BASE_URL: https://www.kraviaprivatelimited.com
