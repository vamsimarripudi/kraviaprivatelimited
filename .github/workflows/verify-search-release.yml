name: Verify released search discovery
on:
  push:
    branches: [feat/search-ai-discovery-20261104]
    paths: [.github/workflows/verify-search-release.yml]
permissions:
  contents: read
jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dc521a38f02d1f7bed4840e14479626e904ba7c4
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Wait for the released site-name signal
        run: |
          node --input-type=module <<'JS'
          import { setTimeout as delay } from 'node:timers/promises';
          let ready = false;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            const response = await fetch('https://www.kraviaprivatelimited.com', { signal: AbortSignal.timeout(20000), headers: { 'Cache-Control': 'no-cache' } });
            const body = await response.text();
            if (response.ok && body.includes('property="og:site_name" content="KRAVIA"')) { ready = true; break; }
            console.log('Production release signal not present yet; attempt', attempt + 1);
            await delay(5000);
          }
          if (!ready) throw new Error('Expected released site-name signal is not available on the public domain');
          JS
      - name: Verify the real public production responses
        working-directory: Frontend
        run: node scripts/search-smoke.mjs
        env:
          SEARCH_SMOKE_BASE_URL: https://www.kraviaprivatelimited.com
