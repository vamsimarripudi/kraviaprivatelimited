name: Office 5.0 K-Vault isolated PostgreSQL security

on:
  pull_request:
    paths:
      - "Database/supabase/migrations/202611140003_office_vault_record_access.sql"
      - "Database/supabase/migrations/202611140004_office_vault_request_withdraw.sql"
      - "Database/supabase/tests/office5_vault_access_security.sql"
      - ".github/workflows/office5-vault-sql.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vault-postgres:
    name: Scoped Vault grants / isolated Postgres 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-vault-ephemeral-only
          POSTGRES_DB: kravia_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kravia_vault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - name: Apply additive migrations and verify no privilege escalation
        shell: bash
        run: |
          set -euo pipefail
          pg() {
            docker run --rm --network host --volume "$PWD:/repo:ro" --workdir /repo \
              --env PGPASSWORD=ci-vault-ephemeral-only postgres:17 \
              psql --host 127.0.0.1 --username postgres --dbname kravia_vault_test \
              --set ON_ERROR_STOP=1 "$@"
          }
          # Test-only service-authority stubs; they do NOT replace the existing
          # production Office identity and effective-permission engine.
          pg --command "create role anon nologin; create role authenticated nologin; create role service_role nologin; create extension if not exists pgcrypto; create table public.office_identity_users(user_id uuid primary key,status text not null); create table public.office_company_registrations(id uuid primary key); create table public.office_document_instances(id uuid primary key); create table public.office_secure_custody_items(id uuid primary key);"
          pg --command "create function public.office_effective_permission(p_actor uuid,p_permission text,p_scope text default 'COMPANY',p_key text default null,p_owner uuid default null) returns boolean language sql stable as \\\$\\\$ select p_actor='00000000-0000-4000-8000-000000000002'::uuid and p_permission in ('access.profile.assign','registration.review','document.instance.review') \\\$\\\$;"
          pg --file Database/supabase/migrations/202611140003_office_vault_record_access.sql
          pg --file Database/supabase/migrations/202611140004_office_vault_request_withdraw.sql
          pg --file Database/supabase/tests/office5_vault_access_security.sql
          counts="$(pg --tuples-only --no-align --command "select (select count(*) from public.office_vault_access_requests),(select count(*) from public.office_vault_access_grants),(select count(*) from public.office_vault_access_events)")"
          test "$counts" = "0|0|0"
