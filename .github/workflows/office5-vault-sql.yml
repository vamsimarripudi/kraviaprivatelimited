name: Office 5.0 K-Vault isolated PostgreSQL security

on:
  pull_request:
    paths:
      - "Database/supabase/migrations/202611140004_office_vault_record_access.sql"
      - "Database/supabase/migrations/202611140005_office_vault_request_withdraw.sql"
      - "Database/supabase/migrations/202611140017_office_vault_sealed_locker.sql"
      - "Database/supabase/migrations/202611140018_office_vault_chunked_ingress.sql"
      - "Database/supabase/tests/office5_vault_access_security.sql"
      - "Database/supabase/tests/office5_vault_secret_security.sql"
      - "Database/supabase/tests/office5_vault_ingress_security.sql"
      - "Database/supabase/tests/office5_vault_stub.sql"
      - ".github/workflows/office5-vault-sql.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vault-postgres:
    name: Scoped Vault grants / isolated Postgres 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-vault-ephemeral-only
          POSTGRES_DB: kravia_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kravia_vault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - name: Apply additive migrations and verify no privilege escalation
        shell: bash
        run: |
          set -euo pipefail
          pg() {
            docker run --rm --network host --volume "$PWD:/repo:ro" --workdir /repo \
              --env PGPASSWORD=ci-vault-ephemeral-only postgres:17 \
              psql --host 127.0.0.1 --username postgres --dbname kravia_vault_test \
              --set ON_ERROR_STOP=1 "$@"
          }
          # Test-only service-authority stubs; they do NOT replace the existing
          # production Office identity and effective-permission engine.
          pg --file Database/supabase/tests/office5_vault_stub.sql
          pg --file Database/supabase/migrations/202611140004_office_vault_record_access.sql
          pg --file Database/supabase/migrations/202611140005_office_vault_request_withdraw.sql
          pg --file Database/supabase/migrations/202611140017_office_vault_sealed_locker.sql
          pg --file Database/supabase/migrations/202611140018_office_vault_chunked_ingress.sql
          pg --file Database/supabase/tests/office5_vault_access_security.sql
          pg --file Database/supabase/tests/office5_vault_secret_security.sql
          pg --file Database/supabase/tests/office5_vault_ingress_security.sql
          counts="$(pg --tuples-only --no-align --command "select (select count(*) from public.office_vault_access_requests),(select count(*) from public.office_vault_access_grants),(select count(*) from public.office_vault_access_events)")"
          test "$counts" = "0|0|0"
