name: KRAVIA Authenticator quality

on:
  push:
    branches: [main]
    paths:
      - "Authenticator/**"
      - ".github/workflows/authenticator.yml"
  pull_request:
    paths:
      - "Authenticator/**"
      - ".github/workflows/authenticator.yml"

permissions:
  contents: read

jobs:
  authenticator:
    name: Authenticator quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Authenticator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Authenticator/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked app dependencies
        run: npm ci --no-fund --no-audit

      - name: Verify Expo SDK dependency compatibility
        run: npx expo install --check

      - name: Dependency audit
        run: npm audit --package-lock-only --audit-level=high

      - name: TypeScript
        run: npm run typecheck

      - name: RFC/provisioning/security tests
        run: npm test

      - name: Generate deterministic KRAVIA native assets
        run: npm run prepare:assets

      - name: Verify generated app icon
        shell: bash
        run: |
          test -s assets/icon.png
          file assets/icon.png | grep -q 'PNG image data, 1024 x 1024'

      - name: Android JS bundle export
        env:
          CI: "1"
        run: npm run export:android

      - name: iOS JS bundle export
        env:
          CI: "1"
        run: npm run export:ios

      - name: Generate Android native project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build offline release-smoke APK
        working-directory: Authenticator/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify final offline Android manifest boundary
        shell: bash
        run: |
          manifest="$(find android/app/build/intermediates -path '*release*' -path '*merged_manifests*' -name AndroidManifest.xml -print -quit)"
          if [ -z "$manifest" ] || [ ! -f "$manifest" ]; then
            echo "Merged release AndroidManifest.xml was not found" >&2
            find android/app/build/intermediates -name AndroidManifest.xml -print || true
            exit 1
          fi
          grep -q 'android.permission.CAMERA' "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "KRAVIA Authenticator release manifest must not request Android INTERNET permission" >&2
            exit 1
          fi
          if grep -q 'android.permission.RECORD_AUDIO' "$manifest"; then
            echo "KRAVIA Authenticator release manifest must not request audio recording permission" >&2
            exit 1
          fi

      - name: Build installable CI-test APK
        shell: bash
        run: |
          set -euo pipefail
          unsigned="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$unsigned"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"

          aligned="kravia-authenticator-ci-test-aligned.apk"
          output="kravia-authenticator-ci-test.apk"
          keystore="$RUNNER_TEMP/kravia-authenticator-ci-test.jks"
          password="$(openssl rand -hex 24)"

          "$build_tools/zipalign" -f -p 4 "$unsigned" "$aligned"
          "$build_tools/zipalign" -c -P 16 -v 4 "$aligned"

          keytool -genkeypair \
            -keystore "$keystore" \
            -storepass "$password" \
            -keypass "$password" \
            -alias kravia-ci-test \
            -keyalg RSA \
            -keysize 4096 \
            -validity 7 \
            -dname "CN=KRAVIA Authenticator CI Test,OU=Engineering,O=Kravia Private Limited,C=IN"

          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias kravia-ci-test \
            --ks-pass "pass:$password" \
            --key-pass "pass:$password" \
            --out "$output" \
            "$aligned"

          "$build_tools/apksigner" verify --verbose --print-certs "$output" | tee kravia-authenticator-ci-test.signature.txt
          rm -f "$aligned" "$keystore"
          unset password

      - name: Record CI-test build evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum kravia-authenticator-ci-test.apk | tee kravia-authenticator-ci-test.apk.sha256
          {
            echo "KRAVIA Authenticator CI test build"
            echo "commit=$GITHUB_SHA"
            echo "purpose=physical-device security and enrollment verification only"
            echo "signing=ephemeral workflow-run-only Android key"
            echo "production=false"
            echo "upgrade_note=uninstall an older CI-test build before installing a build from another workflow run"
            echo "production_requirement=use the persistent KRAVIA-controlled Android signing identity"
          } > kravia-authenticator-ci-test.README.txt

      - name: Upload installable KRAVIA Authenticator CI-test APK
        uses: actions/upload-artifact@v4
        with:
          name: kravia-authenticator-ci-test-apk
          path: |
            Authenticator/kravia-authenticator-ci-test.apk
            Authenticator/kravia-authenticator-ci-test.apk.sha256
            Authenticator/kravia-authenticator-ci-test.signature.txt
            Authenticator/kravia-authenticator-ci-test.README.txt
          if-no-files-found: error
          retention-days: 3
