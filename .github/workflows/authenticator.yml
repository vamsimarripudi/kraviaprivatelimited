name: KRAVIA Authenticator quality

on:
  push:
    branches: [main]
    paths:
      - "Authenticator/**"
      - ".github/workflows/authenticator.yml"
  pull_request:
    paths:
      - "Authenticator/**"
      - ".github/workflows/authenticator.yml"

permissions:
  contents: read

jobs:
  authenticator:
    name: Authenticator quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Authenticator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Authenticator/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked app dependencies
        run: npm ci --no-fund --no-audit

      - name: Verify Expo SDK dependency compatibility
        run: npx expo install --check

      - name: Dependency audit
        run: npm audit --package-lock-only --audit-level=high

      - name: TypeScript
        run: npm run typecheck

      - name: RFC/provisioning tests
        run: npm test

      - name: Android JS bundle export
        env:
          CI: "1"
        run: npm run export:android

      - name: Generate Android native project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Verify offline Android manifest boundary
        shell: bash
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          test -f "$manifest"
          grep -q 'android.permission.CAMERA' "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "KRAVIA Authenticator must not request Android INTERNET permission" >&2
            exit 1
          fi
          if grep -q 'android.permission.RECORD_AUDIO' "$manifest"; then
            echo "KRAVIA Authenticator must not request audio recording permission" >&2
            exit 1
          fi

      - name: Build installable internal APK
        working-directory: Authenticator/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage KRAVIA Authenticator APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kravia-authenticator-internal.apk

      - name: Upload KRAVIA Authenticator APK
        uses: actions/upload-artifact@v4
        with:
          name: kravia-authenticator-internal-apk
          path: Authenticator/kravia-authenticator-internal.apk
          if-no-files-found: error
          retention-days: 7
