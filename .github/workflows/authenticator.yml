name: KRAVIA Authenticator quality

on:
  push:
    branches: [main]
    paths:
      - "Authenticator/**"
      - ".github/workflows/authenticator.yml"
  pull_request:
    paths:
      - "Authenticator/**"
      - ".github/workflows/authenticator.yml"

permissions:
  contents: write

jobs:
  authenticator:
    name: Authenticator quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Authenticator
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install exact app dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit

      - name: Commit generated lockfile to this PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: ${{ github.workspace }}
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "kravia-ci"
          git config user.email "ci@kraviaprivatelimited.com"
          git add Authenticator/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(authenticator): lock production dependencies"
          git push origin HEAD:"$HEAD_BRANCH"

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: TypeScript
        run: npm run typecheck

      - name: RFC/provisioning tests
        run: npm test

      - name: Android JS bundle export
        env:
          CI: "1"
        run: npm run export:android

      - name: Generate Android native project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build installable internal APK
        working-directory: Authenticator/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage KRAVIA Authenticator APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kravia-authenticator-internal.apk

      - name: Upload KRAVIA Authenticator APK
        uses: actions/upload-artifact@v4
        with:
          name: kravia-authenticator-internal-apk
          path: Authenticator/kravia-authenticator-internal.apk
          if-no-files-found: error
          retention-days: 7
